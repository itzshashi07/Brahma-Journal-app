name: brahma_app
description: "InnenFlow - a quieter place to think"
publish_to: 'none'
version: 1.6.0+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  # Vector spiritual motifs (mandala/lotus) authored in-repo
  flutter_svg: ^2.0.10+1
  # Federated sign-in
  google_sign_in: ^6.2.2
  # In-app page-by-page PDF reading (no download affordance)
  flutter_pdfview: ^1.3.2
  # Callable functions replace the direct Razorpay/Resend API calls that used
  # to require secrets inside the app bundle.
  cloud_functions: ^5.1.3
  # Attests that requests come from a genuine build of this app, not a script
  # replaying the (necessarily public) Firebase config.
  firebase_app_check: ^0.3.1+3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Charts
  fl_chart: ^0.70.2

  # Audio
  just_audio: ^0.9.40

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  cupertino_icons: ^1.0.8
  razorpay_flutter: ^1.4.5
  http: ^1.6.0
  speech_to_text: ^7.4.0
  # Voice notes in the counselling chat. speech_to_text transcribes; this
  # captures the audio itself, which is what someone in distress actually wants
  # to send — tone carries what a transcript drops.
  #
  # 6.x, not 5.x: record 5.2.1 resolves record_linux 0.7.2 against
  # record_platform_interface 1.6.0, whose hasPermission() signatures disagree.
  # The Dart analyzer does not compile the desktop implementations, so that
  # combination passes `flutter analyze` and then fails the Android build.
  record: ^6.1.2
  # Renders the UPI QR for the counselling fee. Pure Dart, so the payment card
  # works with no network — which matters, because a member is looking at it
  # precisely when they are about to leave the app for a banking one.
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # Reads the running build's version so the update check compares against
  # reality instead of a constant someone has to remember to bump.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/art/
    # Written article library, parsed only when an admin publishes it.
    - assets/content/articles/
    - assets/art/avatars/
    - assets/fonts/
    - assets/app_icon.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf

# The InnenFlow mark: concentric arcs turning inward on the app's own dark
# violet. Regenerate assets/app_icon.png with:
#
#   magick -size 1024x1024 gradient:'#1E1E4A-#12122A' \
#     -fill none -strokewidth 46 -stroke '#4F46E5' \
#     -draw "stroke-linecap round arc 144,144 880,880 185,95" \
#     -stroke '#A78BFA' \
#     -draw "stroke-linecap round arc 244,244 780,780 5,275" \
#     -stroke '#C4B5FD' \
#     -draw "stroke-linecap round arc 344,344 680,680 185,95" \
#     -fill '#EDE9FE' -stroke none -draw "circle 512,512 512,570" \
#     assets/app_icon.png
#
# then `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#13132B"
  adaptive_icon_foreground: "assets/app_icon.png"
