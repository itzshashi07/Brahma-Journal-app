name: brahma_app
description: "Brahma Journal - Your spiritual wellness companion"
publish_to: 'none'
version: 1.2.0+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  # Vector spiritual motifs (mandala/lotus) authored in-repo
  flutter_svg: ^2.0.10+1
  # Federated sign-in
  google_sign_in: ^6.2.2
  # In-app page-by-page PDF reading (no download affordance)
  flutter_pdfview: ^1.3.2
  # Callable functions replace the direct Razorpay/Resend API calls that used
  # to require secrets inside the app bundle.
  cloud_functions: ^5.1.3
  # Attests that requests come from a genuine build of this app, not a script
  # replaying the (necessarily public) Firebase config.
  firebase_app_check: ^0.3.1+3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Charts
  fl_chart: ^0.70.2

  # Audio
  just_audio: ^0.9.40

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  cupertino_icons: ^1.0.8
  razorpay_flutter: ^1.4.5
  http: ^1.6.0
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # Reads the running build's version so the update check compares against
  # reality instead of a constant someone has to remember to bump.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/art/
    - assets/art/avatars/
    - assets/fonts/
    - assets/app_icon.png

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#13132B"
  adaptive_icon_foreground: "assets/app_icon.png"
