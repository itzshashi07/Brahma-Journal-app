<!--
  ॐ mark, drawn as paths rather than set as text so it renders identically on
  every device regardless of which fonts are installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lower curve -->
    <path d="M24 62 C 24 48, 40 44, 46 54 C 51 63, 40 72, 31 68 C 20 63, 22 44, 40 38"/>
    <!-- Upper loop -->
    <path d="M40 38 C 52 33, 60 40, 58 48 C 57 54, 50 56, 47 52"/>
    <!-- Tail -->
    <path d="M58 48 C 68 48, 76 55, 76 64 C 76 74, 66 80, 56 76"/>
    <!-- Crescent -->
    <path d="M62 26 C 68 20, 80 22, 82 30" opacity="0.85"/>
    <!-- Bindu -->
    <circle cx="86" cy="18" r="3.2" fill="white" stroke="none"/>
  </g>
</svg>
