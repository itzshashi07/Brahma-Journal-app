<!-- Peacock feather — watchfulness and grace. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- quill -->
    <path d="M50 92 C 50 76, 50 64, 50 56"/>
    <!-- barbs -->
    <g opacity="0.55" stroke-width="1.8">
      <path d="M50 74 C 42 70, 37 64, 35 58"/>
      <path d="M50 74 C 58 70, 63 64, 65 58"/>
      <path d="M50 66 C 44 62, 41 57, 40 52"/>
      <path d="M50 66 C 56 62, 59 57, 60 52"/>
    </g>
    <!-- eye -->
    <path d="M50 14 C 68 20, 76 38, 68 50 C 62 58, 38 58, 32 50 C 24 38, 32 20, 50 14 Z"/>
    <ellipse cx="50" cy="36" rx="13" ry="15" opacity="0.75"/>
    <ellipse cx="50" cy="36" rx="6" ry="7.5" fill="white" stroke="none"/>
  </g>
</svg>
