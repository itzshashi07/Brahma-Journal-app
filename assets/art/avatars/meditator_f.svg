    <circle cx="50" cy="28" r="10" fill="white" stroke="none"/>
    <!-- gathered hair -->
    <circle cx="50" cy="14" r="5" fill="white" stroke="none" opacity="0.9"/>
    <path d="M40 26 C 40 18, 60 18, 60 26" opacity="0.85" stroke-width="2.4"/>
    <!-- torso -->
