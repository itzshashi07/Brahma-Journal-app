<!-- Diya — the lamp lit at the start of practice. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- flame -->
    <path d="M50 20 C 58 30, 60 38, 55 44 C 52 47, 48 47, 45 44 C 40 38, 42 30, 50 20 Z"
          fill="white" stroke="none"/>
    <path d="M50 32 C 53 37, 53 41, 50 44 C 47 41, 47 37, 50 32 Z"
