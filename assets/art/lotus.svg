<!--
  Lotus motif — used as the app mark and in screen headers.
  Drawn white; tinted at the use site.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <g stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centre petal -->
    <path d="M60 88 C 46 66, 46 40, 60 14 C 74 40, 74 66, 60 88 Z" opacity="0.95"/>
    <!-- First pair -->
    <path d="M60 88 C 36 72, 26 50, 28 26 C 48 40, 58 62, 60 88 Z" opacity="0.75"/>
    <path d="M60 88 C 84 72, 94 50, 92 26 C 72 40, 62 62, 60 88 Z" opacity="0.75"/>
    <!-- Outer pair -->
    <path d="M60 88 C 30 84, 12 70, 6 50 C 30 54, 50 68, 60 88 Z" opacity="0.55"/>
    <path d="M60 88 C 90 84, 108 70, 114 50 C 90 54, 70 68, 60 88 Z" opacity="0.55"/>
    <!-- Water line -->
    <path d="M18 92 C 34 96, 86 96, 102 92" opacity="0.35"/>
  </g>
</svg>
