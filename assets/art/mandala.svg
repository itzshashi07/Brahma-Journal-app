<!--
  Sacred geometry mandala, authored by hand.

  Drawn in white so it can be tinted at the use site with a ColorFilter, and
  built from a small set of <path> primitives repeated with rotate() so the file
  stays a couple of KB rather than shipping a bitmap. Vector means it stays
  crisp behind a 400pt hero on a tablet and a 60pt watermark on a phone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- One petal, pointing up from centre. Reused for every ring. -->
    <path id="petal"
          d="M100 100 C 92 74, 92 56, 100 34 C 108 56, 108 74, 100 100 Z"/>
    <path id="petalSm"
          d="M100 100 C 95 86, 95 76, 100 64 C 105 76, 105 86, 100 100 Z"/>
    <path id="ray" d="M100 24 L100 8"/>
  </defs>

  <g stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.9">
    <!-- Concentric rings -->
    <circle cx="100" cy="100" r="96" opacity="0.30"/>
    <circle cx="100" cy="100" r="88" opacity="0.55"/>
    <circle cx="100" cy="100" r="66" opacity="0.40"/>
    <circle cx="100" cy="100" r="44" opacity="0.55"/>
    <circle cx="100" cy="100" r="22" opacity="0.70"/>
    <circle cx="100" cy="100" r="6"  opacity="0.90"/>

    <!-- 16 outer petals -->
    <g opacity="0.55">
      <use href="#petal" transform="rotate(0 100 100)"/>
      <use href="#petal" transform="rotate(22.5 100 100)"/>
      <use href="#petal" transform="rotate(45 100 100)"/>
      <use href="#petal" transform="rotate(67.5 100 100)"/>
      <use href="#petal" transform="rotate(90 100 100)"/>
      <use href="#petal" transform="rotate(112.5 100 100)"/>
      <use href="#petal" transform="rotate(135 100 100)"/>
      <use href="#petal" transform="rotate(157.5 100 100)"/>
      <use href="#petal" transform="rotate(180 100 100)"/>
      <use href="#petal" transform="rotate(202.5 100 100)"/>
      <use href="#petal" transform="rotate(225 100 100)"/>
      <use href="#petal" transform="rotate(247.5 100 100)"/>
      <use href="#petal" transform="rotate(270 100 100)"/>
      <use href="#petal" transform="rotate(292.5 100 100)"/>
      <use href="#petal" transform="rotate(315 100 100)"/>
      <use href="#petal" transform="rotate(337.5 100 100)"/>
    </g>

    <!-- 8 inner petals, offset so they sit between the outer ones -->
    <g opacity="0.75">
      <use href="#petalSm" transform="rotate(11.25 100 100)"/>
      <use href="#petalSm" transform="rotate(56.25 100 100)"/>
      <use href="#petalSm" transform="rotate(101.25 100 100)"/>
      <use href="#petalSm" transform="rotate(146.25 100 100)"/>
      <use href="#petalSm" transform="rotate(191.25 100 100)"/>
      <use href="#petalSm" transform="rotate(236.25 100 100)"/>
      <use href="#petalSm" transform="rotate(281.25 100 100)"/>
      <use href="#petalSm" transform="rotate(326.25 100 100)"/>
    </g>

    <!-- Outer rays -->
    <g opacity="0.45">
      <use href="#ray" transform="rotate(0 100 100)"/>
      <use href="#ray" transform="rotate(30 100 100)"/>
      <use href="#ray" transform="rotate(60 100 100)"/>
      <use href="#ray" transform="rotate(90 100 100)"/>
      <use href="#ray" transform="rotate(120 100 100)"/>
      <use href="#ray" transform="rotate(150 100 100)"/>
      <use href="#ray" transform="rotate(180 100 100)"/>
      <use href="#ray" transform="rotate(210 100 100)"/>
      <use href="#ray" transform="rotate(240 100 100)"/>
      <use href="#ray" transform="rotate(270 100 100)"/>
      <use href="#ray" transform="rotate(300 100 100)"/>
      <use href="#ray" transform="rotate(330 100 100)"/>
    </g>
  </g>
</svg>
